# Publish the repo root as-is (no build step).
[build]
  publish = "."
  # Publish at most once a day: Netlify only builds when the latest commit message contains [deploy].
  # The daily "publish" scheduled task makes that commit; any other push is skipped (saves deploy credits).
  # Exit code 0 = skip the build, 1 = build.
  ignore = "! git log -1 --pretty=%B | grep -qF '[deploy]'"

# Always revalidate HTML so visitors get the latest version right after a deploy.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
