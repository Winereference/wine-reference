# Publishes the site to GitHub Pages on every push to main.
# It runs tools/optimize_site.py, which moves the big inline data scripts of index.html into cached files in the
# PUBLISHED copy only (the repo's index.html is unchanged, so the daily tasks keep editing it as before).
# Needs: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build optimised copy
        run: python3 tools/optimize_site.py . _site
      - name: Check the optimised page
        run: |
          test -s _site/index.html
          test -s _site/CNAME
          ls _site/assets/js | head
          grep -q 'assets/js/app-01-' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
